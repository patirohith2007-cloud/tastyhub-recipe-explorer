<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7043" />
      <stop offset="100%" stop-color="#E65100" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#grad)" filter="url(#shadow)" />
  
  <!-- Utensils Cross Icon & Chef Hat -->
  <g transform="translate(106, 106)" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <!-- Plate circle -->
    <circle cx="150" cy="150" r="130" stroke="#FFFFFF" stroke-width="18" opacity="0.3" />
    <!-- Fork -->
    <path d="M90 60 v80 a30 30 0 0 0 60 0 v-80" stroke-width="20" />
    <path d="M120 170 v90" stroke-width="24" />
    <path d="M100 60 v40 M140 60 v40" stroke-width="16" />
    <!-- Knife -->
    <path d="M190 60 v100 a20 20 0 0 1 -20 20 h-5" stroke-width="20" />
    <path d="M180 180 v80" stroke-width="24" />
  </g>
</svg>
